<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!--
			Self-hosted rather than loaded from Google Fonts. A study build must not
			cause participants' browsers to contact third parties — see
			scripts/check-external-requests.mjs, which fails the build if it does.
		-->
		<style>
			@font-face {
				font-family: 'Jersey 10';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/jersey10-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
					U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
					U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Jersey 10';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/jersey10-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
					U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
					U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Transformer Explainer: LLM Transformer Model Visually Explained</title>

		<!-- Primary Meta Tags -->
		<meta name="title" content="Transformer Explainer: LLM Transformer Model Visually Explained" />
		<meta
			name="description"
			content="An interactive visualization tool showing you how transformer models work in large language models (LLM) like GPT."
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://poloclub.github.io/transformer-explainer/" />
		<meta
			property="og:title"
			content="Transformer Explainer: LLM Transformer Model Visually Explained"
		/>
		<meta
			property="og:description"
			content="An interactive visualization tool showing you how transformer models work in large language models (LLM) like GPT."
		/>
		<meta
			property="og:image"
			content="https://poloclub.github.io/transformer-explainer/preview/summary.png"
		/>

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://poloclub.github.io/transformer-explainer/" />
		<meta
			property="twitter:title"
			content="Transformer Explainer: LLM Transformer Model Visually Explained"
		/>
		<meta
			property="twitter:description"
			content="An interactive visualization tool showing you how transformer models work in large language models (LLM) like GPT."
		/>
		<meta
			property="twitter:image"
			content="https://poloclub.github.io/transformer-explainer/preview/summary.png"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
