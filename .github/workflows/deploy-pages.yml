name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight during the study window.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Build
        env:
          # Public by design — see src/study/env.ts. Set these as repository
          # *variables* (Settings > Secrets and variables > Actions > Variables),
          # not secrets: secrets are masked in logs but still end up in the
          # bundle, and pretending otherwise invites someone to put a real secret
          # here later.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_QUALTRICS_POST_SURVEY_URL: ${{ vars.VITE_QUALTRICS_POST_SURVEY_URL }}
          VITE_STUDY_MOCK_MODEL: 'false'
          VITE_STUDY_ENABLED: 'true'
          # Repo name for project Pages. Set BASE_PATH to '' for a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || '/te-study' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is unset — the study would collect nothing"; exit 1; }
          test -n "$VITE_QUALTRICS_POST_SURVEY_URL" || { echo "::error::VITE_QUALTRICS_POST_SURVEY_URL is unset — participants would hit a dead end"; exit 1; }
          npm run build

      - name: Guard against a mock-model deploy
        # Shipping the E2E mock would give every participant canned data instead
        # of a live model, and it is a one-word mistake.
        run: |
          if grep -rql "VITE_STUDY_MOCK_MODEL.*true" build/_app 2>/dev/null; then
            echo "::error::build appears to have mock-model mode enabled"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
