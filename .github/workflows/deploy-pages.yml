name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight during the study window.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Build
        env:
          # Public by design — see src/study/env.ts. Set these as repository
          # *variables* (Settings > Secrets and variables > Actions > Variables),
          # not secrets: secrets are masked in logs but still end up in the
          # bundle, and pretending otherwise invites someone to put a real secret
          # here later.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_QUALTRICS_POST_SURVEY_URL: ${{ vars.VITE_QUALTRICS_POST_SURVEY_URL }}
          VITE_STUDY_MOCK_MODEL: 'false'
          VITE_STUDY_ENABLED: 'true'
          # Repo name for project Pages. Set BASE_PATH to '' for a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || '/te-study' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is unset — the study would collect nothing"; exit 1; }
          test -n "$VITE_QUALTRICS_POST_SURVEY_URL" || { echo "::error::VITE_QUALTRICS_POST_SURVEY_URL is unset — participants would hit a dead end"; exit 1; }
          npm run build

      - name: Guard against a mock-model deploy
        # Shipping the E2E mock would give every participant canned data instead
        # of a live model, and it is a one-word mistake.
        #
        # The check is on the build input plus an exact-value match in the
        # bundle. An earlier version grepped /VITE_STUDY_MOCK_MODEL.*true/, which
        # matched the comparison expression `...VITE_STUDY_MOCK_MODEL)==="true"`
        # that env.ts compiles to — so it failed every build regardless of the
        # actual setting. `.*` across minified JS matches far more than intended.
        env:
          VITE_STUDY_MOCK_MODEL: 'false'
        run: |
          test "$VITE_STUDY_MOCK_MODEL" = "false" || {
            echo "::error::VITE_STUDY_MOCK_MODEL is '$VITE_STUDY_MOCK_MODEL', expected false"; exit 1; }
          if grep -rqF 'VITE_STUDY_MOCK_MODEL:"true"' build/_app; then
            echo "::error::built bundle has mock-model mode enabled"; exit 1
          fi
          grep -rqF 'VITE_STUDY_MOCK_MODEL:"false"' build/_app || {
            echo "::error::could not confirm mock-model is disabled in the bundle"; exit 1; }
          echo "mock-model mode is off in the built bundle"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Must exceed the action's own `timeout` below, or the job is killed first
    # and the action never gets to report why.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The artifact is ~688 MB, almost all of it ONNX weights, and GitHub's
          # side of the deploy regularly runs past the action's 10-minute
          # default — it timed out on f274ba0 with the deployment still
          # in_progress, having built and uploaded fine. This is the warm
          # standby, so a slow publish is not urgent, but a red X on every push
          # trains everyone to ignore the one that matters.
          timeout: 1800000
